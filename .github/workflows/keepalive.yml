name: Supabase Keep-Alive

# Supabase free-tier projects pause after 7 days with no API activity, which
# makes "Send to Manager" fail with what looks like a network error.
# This pings twice a week, well inside the limit.
# NOTE: GitHub only fires scheduled workflows from the repo's DEFAULT branch.
on:
  schedule:
    - cron: '0 6 * * 1,4'    # Mon & Thu 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/asset_reports?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "HTTP $code"
          [ "$code" -lt 400 ] || echo "::warning::Supabase returned $code - project may be paused"
        env:
          SUPABASE_URL: https://kydadxlqyiswqljhoobk.supabase.co
          SUPABASE_KEY: sb_publishable_NSixy3qIu1-8csxnuExDZw_jPDBiJOV
